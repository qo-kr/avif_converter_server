# fly.toml app configuration file generated for oq-imgcomp on 2024-02-17T14:58:47+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "oq-imgcomp"
org = "genideas"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  RUST_LOG = "info"

[http_service]
  internal_port = 8080
  force_https = true
  #auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 3
  processes = ['app']
  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/up"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
